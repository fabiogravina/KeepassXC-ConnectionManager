# S16: aggiornamenti proposti come pull request, così le versioni fissate (Actions per hash,
# pacchetti NuGet bloccati) non restano indietro. Ogni aggiornamento passa dalla CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      dotnet:
        patterns: ["Microsoft.*", "System.*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
