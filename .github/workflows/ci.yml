name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# S16: Actions fissate all'hash del commit (il commento indica la versione), immagini dei runner
# e versione di KeePassXC esplicite. Dependabot (.github/dependabot.yml) propone gli aggiornamenti.
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # keepassxc-cli per i test di integrazione e di sicurezza (senza, vengono saltati).
      # dbus-daemon serve ai test del blocco su Linux (S15), che altrimenti verrebbero saltati.
      - name: Installa KeePassXC e dbus-daemon (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y keepassxc=2.7.6+dfsg.1-1build3 dbus-daemon
          keepassxc-cli --version
          dbus-daemon --version

      - name: Installa KeePassXC (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install keepassxc --version 2.7.12 -y --no-progress
          & "$env:ProgramFiles\KeePassXC\keepassxc-cli.exe" --version

      - name: Restore
        run: dotnet restore Kxc.sln --locked-mode

      - name: Formattazione
        run: dotnet format Kxc.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Kxc.sln --no-restore -c Release

      - name: Test
        run: dotnet test --solution Kxc.sln --no-build -c Release

      - name: Vulnerabilità note nei pacchetti (SEC-09)
        shell: bash
        run: |
          dotnet list Kxc.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "ha i seguenti pacchetti vulnerabili\|has the following vulnerable packages" vulnerable.txt
